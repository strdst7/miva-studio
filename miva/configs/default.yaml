# MIVA Studio Configuration
# Production defaults — customize per deployment

system:
  version: "1.0.0"
  pipeline_version: "v1.0"

retrieval:
  vector_store_type: "qdrant"        # qdrant, faiss, or pinecone
  vector_store_path: "./vector_store"
  embedding_model: "arcface_r50"
  embedding_dim: 512
  top_k: 5                           # Retrieve top-5 anchors per query
  diversity_threshold: 0.95          # Reranking: avoid near-duplicate embeddings
  recall_threshold: 0.70             # Minimum acceptable recall@k

generation:
  model: "stable-diffusion-3"
  guidance_scale: 7.5
  num_inference_steps: 50
  ip_adapter_scale: 1.0
  seed: null                         # Set to fixed value for reproducibility

guardrails:
  identity:
    threshold: 0.75                  # FaceNet threshold
    source: "FaceNet (Schroff et al., 2015); ArcFace (Deng et al., 2019)"
  quality:
    artifact_score_threshold: 0.20
  safety:
    nsfw_threshold: 0.5
  agent:
    max_regeneration_attempts: 3     # Hard stop at 3 failures (semantic stopping)

observability:
  trace_output_dir: "./logs/traces"
  metrics_enabled: true
  prometheus_port: 8000
  log_level: "INFO"                  # DEBUG, INFO, WARNING, ERROR
  
  # Alert thresholds (see docs/observability.md)
  alerts:
    identity_score_p50:
      threshold: 0.78
      direction: "below"
      severity: "CRITICAL"
    guardrail_pass_rate:
      threshold: 0.70
      direction: "below"
      severity: "WARNING"
    hard_stop_rate:
      threshold: 0.05
      direction: "above"
      severity: "CRITICAL"
    retrieval_p95_latency_ms:
      threshold: 300
      direction: "above"
      severity: "WARNING"

evaluation:
  enabled: true
  dataset_path: "./data/eval_dataset"
  regression_detection: true
  
  # Regression thresholds (see Section 6 of publication)
  regression_thresholds:
    identity_score_mean: -0.03       # 3% absolute drop
    retrieval_recall_at_3: -0.05     # 5% absolute drop
    guardrail_pass_rate: -0.05
    hard_stop_rate: 0.02             # 2% absolute increase
    false_positive_rate: 0.01        # 1% increase → CRITICAL
